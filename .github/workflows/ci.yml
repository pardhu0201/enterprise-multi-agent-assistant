name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend - lint, tests, evals
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Tests
        run: pytest -q

      # The evaluation harness runs in deterministic mode, so it needs no API
      # key and no network - it is a real regression gate, not a smoke test.
      # It exits non-zero if retrieval recall, routing accuracy, citation
      # validity or human-gate enforcement fall below their thresholds.
      - name: Evaluate against the golden set
        run: python -m evals.run_eval --json eval-report.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: backend/eval-report.json
          if-no-files-found: ignore

  frontend:
    name: Frontend - typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: northwind-assistant:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot the container and check health
        run: |
          docker run -d --name assistant -p 7860:7860 northwind-assistant:ci
          for i in $(seq 1 30); do
            if curl -fs http://127.0.0.1:7860/api/health > /dev/null; then
              echo "healthy after ${i}s"
              curl -s http://127.0.0.1:7860/api/health
              exit 0
            fi
            sleep 2
          done
          echo "container did not become healthy"
          docker logs assistant
          exit 1
