# Render blueprint - free web service + free Postgres.
# Push this repo, then "New > Blueprint" in Render and point it at the repo.
#
# Note: Render free web services sleep after 15 minutes of inactivity and take
# ~50s to wake. Hugging Face Spaces (see DEPLOYMENT.md) does not sleep, which
# is why it is the recommended host for the public demo.

services:
  - type: web
    name: northwind-assistant
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "10000"
      - key: APP_ENV
        value: production
      - key: SEED_ON_STARTUP
        value: "true"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: northwind-db
          property: connectionString

databases:
  - name: northwind-db
    plan: free
    postgresMajorVersion: "16"
